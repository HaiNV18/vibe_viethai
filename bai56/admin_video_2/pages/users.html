<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Video Admin</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <!-- Main Content Area -->
    <div class="app-main">
      <!-- Topbar Header -->
      <header class="app-topbar" id="app-topbar"></header>

      <!-- Main Body -->
      <main class="content-area">
        <div class="content-header">
          <div>
            <h1>User Management</h1>
            <div class="breadcrumb">Manage user accounts, roles, access levels, and credentials (Admin Only)</div>
          </div>
          <div>
            <button type="button" class="btn btn-primary" id="open-add-user-modal-btn">
              <i class="fa-solid fa-user-plus"></i>
              <span>Add User</span>
            </button>
          </div>
        </div>

        <!-- Filter Toolbar -->
        <div class="card" style="padding: 1.25rem; margin-bottom: 1.25rem;">
          <div class="toolbar-bar" style="margin-bottom: 0;">
            <div class="search-input-wrapper">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="user-search-input" class="form-control" placeholder="Search by username or email...">
            </div>

            <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
              <select id="filter-user-role" class="form-control" style="width: auto; min-width: 130px;">
                <option value="ALL">All Roles</option>
                <option value="ADMIN">ADMIN</option>
                <option value="USER">USER</option>
              </select>

              <select id="filter-user-status" class="form-control" style="width: auto; min-width: 130px;">
                <option value="ALL">All Status</option>
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
              </select>

              <span id="users-total-count" class="badge" style="background:#f1f5f9; color:var(--text-muted); font-size:0.8rem; padding:0.4rem 0.75rem;">
                0 users
              </span>
            </div>
          </div>
        </div>

        <!-- Users Table -->
        <div class="table-card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 60px;">ID</th>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Created At</th>
                  <th style="text-align: right; width: 90px;">Actions</th>
                </tr>
              </thead>
              <tbody id="users-tbody">
                <tr>
                  <td colspan="7" style="text-align: center; padding: 2rem;">Loading users...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit User Modal Dialog -->
  <div class="modal-backdrop" id="user-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="user-modal-title">Add User</h3>
        <button type="button" class="action-btn" onclick="Users.closeUserModal()">&times;</button>
      </div>
      <form id="user-modal-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="user-modal-username" class="form-label">
              Username <span class="required">*</span>
            </label>
            <input type="text" id="user-modal-username" class="form-control" placeholder="username" required minlength="3">
          </div>

          <div class="form-group">
            <label for="user-modal-email" class="form-label">
              Email Address <span class="required">*</span>
            </label>
            <input type="email" id="user-modal-email" class="form-control" placeholder="user@example.com" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="user-modal-role" class="form-label">Role <span class="required">*</span></label>
              <select id="user-modal-role" class="form-control" required>
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>

            <div class="form-group">
              <label for="user-modal-status" class="form-label">Status <span class="required">*</span></label>
              <select id="user-modal-status" class="form-control" required>
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="user-modal-password" class="form-label">Password</label>
            <input type="password" id="user-modal-password" class="form-control" placeholder="••••••••">
            <div id="user-modal-password-help" class="form-helper" style="display: none;">Leave blank if you do not want to change the password.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="Users.closeUserModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/csv.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/users.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Storage.initData();
      await Users.init();
    });
  </script>
</body>
</html>
