<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Video Admin</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fa-solid fa-circle-play"></i>
        <span>VideoAdmin</span>
      </div>
      <h1 class="auth-title">Create an Account</h1>
      <p class="auth-subtitle">Register a new user account to get started</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label for="reg-username" class="form-label">
          Username <span class="required">*</span>
        </label>
        <input type="text" id="reg-username" class="form-control" placeholder="Choose a username" required minlength="3">
      </div>

      <div class="form-group">
        <label for="reg-email" class="form-label">
          Email Address <span class="required">*</span>
        </label>
        <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="reg-password" class="form-label">
          Password <span class="required">*</span>
        </label>
        <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        <div class="form-helper">Minimum 6 characters.</div>
      </div>

      <div class="form-group">
        <label for="reg-confirm-password" class="form-label">
          Confirm Password <span class="required">*</span>
        </label>
        <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" id="reg-submit-btn" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
        <i class="fa-solid fa-user-plus"></i>
        <span>Create Account</span>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/csv.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Storage.initData();
      Guard.requireGuest();

      const regForm = document.getElementById('register-form');
      const submitBtn = document.getElementById('reg-submit-btn');

      regForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm-password').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Creating Account...</span>';

        try {
          const result = await Auth.register({ username, email, password, confirmPassword });
          if (result.success) {
            Components.showToast('Registration Successful', result.message, 'success');
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1200);
          } else {
            Components.showToast('Registration Failed', result.message, 'danger');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> <span>Create Account</span>';
          }
        } catch (err) {
          Components.showToast('Error', err.message || 'Registration failed', 'danger');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> <span>Create Account</span>';
        }
      });
    });
  </script>
</body>
</html>
