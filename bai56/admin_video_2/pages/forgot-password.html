<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Video Admin</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fa-solid fa-circle-play"></i>
        <span>VideoAdmin</span>
      </div>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your registered email address to receive password instructions (simulation)</p>
    </div>

    <form id="forgot-form">
      <div class="form-group">
        <label for="forgot-email" class="form-label">
          Email Address <span class="required">*</span>
        </label>
        <input type="email" id="forgot-email" class="form-control" placeholder="admin1@gmail.com" required>
      </div>

      <div id="simulation-result" style="display: none; padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; font-size: 0.85rem; line-height: 1.4;"></div>

      <button type="submit" class="btn btn-primary" id="forgot-submit-btn" style="width: 100%; padding: 0.75rem;">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Send Instructions</span>
      </button>
    </form>

    <div class="auth-footer">
      Remembered your password? <a href="login.html">Back to Sign In</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/csv.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Storage.initData();

      const form = document.getElementById('forgot-form');
      const submitBtn = document.getElementById('forgot-submit-btn');
      const resultBox = document.getElementById('simulation-result');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Checking...</span>';

        try {
          const result = await Auth.forgotPassword(email);
          resultBox.style.display = 'block';

          if (result.success) {
            resultBox.style.backgroundColor = 'var(--success-50)';
            resultBox.style.color = 'var(--success-text)';
            resultBox.style.border = '1px solid #a7f3d0';
            resultBox.innerHTML = `<strong><i class="fa-solid fa-circle-check"></i> Success:</strong> ${result.message}`;
            Components.showToast('Notice', 'Password reset simulation processed.', 'success');
          } else {
            resultBox.style.backgroundColor = 'var(--danger-50)';
            resultBox.style.color = 'var(--danger-text)';
            resultBox.style.border = '1px solid #fecaca';
            resultBox.innerHTML = `<strong><i class="fa-solid fa-triangle-exclamation"></i> Error:</strong> ${result.message}`;
            Components.showToast('Notice', result.message, 'danger');
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Send Instructions</span>';
        }
      });
    });
  </script>
</body>
</html>
