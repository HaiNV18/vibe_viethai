<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu — Video Admin</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">V</div>
        <h1 class="auth-title">Khôi phục mật khẩu</h1>
        <p class="auth-subtitle">Nhập email đăng ký để nhận mã hỗ trợ khôi phục Demo</p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email" class="form-label">Email tài khoản</label>
          <input type="email" id="email" class="form-input" placeholder="admin@video.com" required autocomplete="email">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-md);">
          <span>Gửi yêu cầu khôi phục</span>
        </button>
      </form>

      <div id="result-box" style="display: none; margin-top: var(--spacing-lg); padding: var(--spacing-md); background: var(--bg-surface-elevated); border: 1px solid var(--border-focus); border-radius: var(--radius-md);">
        <div style="color: var(--success); font-weight: 700; margin-bottom: 0.5rem;">✅ Tạo mã thành công!</div>
        <div style="font-size: var(--font-size-sm); color: var(--text-secondary);">Mã khôi phục Demo: <strong id="token-code" style="color: var(--accent-primary); font-size: var(--font-size-md);"></strong></div>
        <p style="font-size: var(--font-size-xs); color: var(--text-muted); margin-top: 0.5rem;">
          *(Lưu ý: Do kiến trúc Client-side Frontend-only không có backend email service, mã này được tạo trực tiếp tại trình duyệt).*
        </p>
      </div>

      <div class="auth-footer">
        Quay lại <a href="login.html" class="auth-link">Đăng nhập</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/forgot-password.js"></script>
</body>
</html>
